name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: bun-darwin-arm64
            native_package: "@opentui/core-darwin-arm64"
            asset: all-configs-tui-darwin-arm64
          - os: macos-15
            target: bun-darwin-x64
            native_package: "@opentui/core-darwin-x64"
            asset: all-configs-tui-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            native_package: "@opentui/core-linux-x64-musl"
            asset: all-configs-tui-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            native_package: "@opentui/core-linux-arm64-musl"
            asset: all-configs-tui-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Do not use --frozen-lockfile: each cross-target build needs its own
        # optional OpenTUI native package. Bun skips linking native packages
        # whose platform doesn't match the host (e.g. darwin-x64 on an
        # arm64 runner), so extract the target's package tarball manually at
        # the exact version @opentui/core depends on.
        working-directory: cli
        run: |
          bun install
          version="$(node -p "require('./node_modules/@opentui/core/package.json').version")"
          tgz="$(npm pack "${{ matrix.native_package }}@$version" | tail -1)"
          dir="node_modules/${{ matrix.native_package }}"
          rm -rf "$dir"
          mkdir -p "$dir"
          tar -xzf "$tgz" -C "$dir" --strip-components=1
          rm "$tgz"

      - name: Compile the TUI
        working-directory: cli
        env:
          # Baked into the binary: `all-configs --version` reports it.
          ALL_CONFIGS_VERSION: ${{ github.ref_name }}
        run: >
          bun run build-release.ts
          ${{ matrix.target }} ${{ matrix.asset }}
          ${{ runner.os == 'Linux' && 'musl' || '' }}

      - name: Smoke test host-native executable
        if: matrix.target == 'bun-darwin-arm64' || matrix.target == 'bun-linux-x64' || matrix.target == 'bun-linux-arm64'
        working-directory: cli
        run: test -x "${{ matrix.asset }}"

      - name: Compress GitHub release asset
        working-directory: cli
        run: gzip -9 -c ${{ matrix.asset }} > ${{ matrix.asset }}.gz

      - name: Upload GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: cli/${{ matrix.asset }}.gz

      - name: Upload binary for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: all-configs-tui-*
          path: npm-binaries
          merge-multiple: true

      - name: Prepare npm packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/prepare-npm-packages.sh "$version" npm-binaries npm-packages

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_if_missing() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish "./$dir" --access public --provenance
            fi
          }

          for dir in npm-packages/darwin-* npm-packages/linux-*; do
            publish_if_missing "$dir"
          done
          publish_if_missing npm-packages/main
