name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: bun-darwin-arm64
            asset: all-configs-tui-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            asset: all-configs-tui-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: all-configs-tui-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: all-configs-tui-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # not --frozen-lockfile: platform-specific native opentui binaries
        # must resolve on each target
        working-directory: experimental/opentui
        run: bun install

      - name: Install musl native lib
        # bun's compiled linux executables are musl-linked, and @opentui/core
        # resolves its native package from the runtime libc — which is glibc
        # on the runner. Install the musl variant the compiled binary needs.
        if: runner.os == 'Linux'
        working-directory: experimental/opentui
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="x64" ;;
            aarch64) arch="arm64" ;;
          esac
          bun add --dev "@opentui/core-linux-${arch}-musl"

      - name: Compile the TUI
        working-directory: experimental/opentui
        run: >
          bun build --compile --target=${{ matrix.target }}
          src/index.tsx --outfile ${{ matrix.asset }}

      - name: Compress (the embedded runtime shrinks ~3x)
        working-directory: experimental/opentui
        run: gzip -9 -c ${{ matrix.asset }} > ${{ matrix.asset }}.gz

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: experimental/opentui/${{ matrix.asset }}.gz
